name: Diagrams

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      PLANTUML: java -jar /tmp/plantuml.jar
    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y graphviz
          curl -fsSL -o /tmp/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar

      - name: Render
        run: git ls-files '*/Makefile' | xargs -d '\n' -n1 dirname | xargs -d '\n' -I{} make -C {}

      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: |
            **/*.svg
            **/*.png
